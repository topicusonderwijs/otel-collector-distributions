dist:
  name: otelcol-splunk
  description: OTel Collector Splunk HEC
  output_path: ./dist
  version: 0.0.0-dev # x-release-please-version
extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.1
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/pprofextension v0.164.1
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/splunkhecexporter v0.164.1
processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.164.0
receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.1
connectors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector v0.164.1
providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.70.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.70.0
